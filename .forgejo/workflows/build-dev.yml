# Note: We use --silent argument on yarn invocations to keep the output simple
# and readable through email notifications.
name: Build archive

on:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref so we don't waste CI minutes building
# commits that are no longer the head of a branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_CACHE_DIR: '${{ github.workspace }}/apt-cache'

jobs:
  build:
    name: Build
    runs-on: node-lts
    container:
      image: node:24.15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn-cache
            node_modules
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run --silent build:prod

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-release
          restore-keys: |
            apt-release

      - name: Zip
        run: |
          mkdir -p $APT_CACHE_DIR
          zip -v > /dev/null 2>&1 || (apt update && apt install -o dir::cache::archives="$APT_CACHE_DIR" -y zip)
          mkdir -p ./dist/release/
          zip dist/release/build.zip -r ./build ./bin/kresus.js ./package.json ./yarn.lock

      - name: Upload release artifact
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          tag: pre-release
          override: true
          prerelease: true
          release-dir: ./dist/release
          release-notes: |
            Latest build of Kresus on `main`, ready for usage.
